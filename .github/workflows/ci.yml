name: CI Tests - Avatars vs Rooks

on:
  push:
    branches: [ "SofiaPruebasUnitarias" ] 
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Verify Python installation
      run: |
        python --version
        echo "Build completado - Python configurado correctamente"
    
    - name: Check project structure
      run: |
        echo "Estructura del proyecto:"
        ls -la
        echo "Build exitoso"

  
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build  
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install bcrypt
        python -c "import bcrypt; print('bcrypt instalado')"
    
    - name: Run unit tests
      run: |
        echo "🔍 Verificando imports..."
        python -c "
        import sys
        sys.path.append('.')
        try:
            from UserAutentication import UserAuthentication
            print('UserAuthentication importado correctamente')
        except Exception as e:
            print(f'Error importando: {e}')
        "
        echo "Ejecutando pruebas..."
        python tests/test_autentication.py




